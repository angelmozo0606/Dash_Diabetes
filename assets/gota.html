<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --red: #e0313f; --blue: #2a6fdb; --sun: #f5a524; --ink: #1f1630; --plum: #2b1f3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font-family: Figtree, system-ui, sans-serif; color: #fff; overflow: hidden; }
  .wrap { display: flex; gap: 18px; align-items: center; height: 100vh; padding: 6px; }
  .stage { flex: 1.25; position: relative; height: 100%; min-height: 260px; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .hint { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 12px; color: rgba(255,255,255,.55); pointer-events: none; }
  .side { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .meter { background: #f4eef8; color: var(--ink); border-radius: 26px 26px 34px 34px; padding: 14px 14px 16px; box-shadow: inset 0 -5px 0 rgba(31,22,48,.12); }
  .meter-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a7c95; margin: 0 4px 8px; }
  .screen { background: #cfe3c8; border-radius: 12px; padding: 10px 12px 8px; box-shadow: inset 0 2px 6px rgba(0,0,0,.18); font-family: "Bricolage Grotesque", sans-serif; color: #1d2b1a; }
  .value { font-size: 52px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font-size: 14px; font-weight: 600; margin-left: 4px; }
  .status { margin-top: 6px; font-family: Figtree, sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); transition: background .3s; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .levels button { font: 700 13px Figtree, sans-serif; padding: 10px 4px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer; transition: all .2s; }
  .levels button:hover { border-color: rgba(255,255,255,.6); }
  .levels button.on[data-k="normal"] { background: var(--blue); border-color: var(--blue); }
  .levels button.on[data-k="pre"] { background: var(--sun); border-color: var(--sun); color: var(--ink); }
  .levels button.on[data-k="dm"] { background: var(--red); border-color: var(--red); }
  .caption { font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.78); margin: 0; }
  .caption b { color: #fff; }

  @media (max-width: 460px) {
    .wrap { flex-direction: column; gap: 10px; }
    .stage { width: 100%; flex: none; height: 250px; }
    .side { width: 100%; }
    .value { font-size: 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="c" aria-label="Gota de sangre con moléculas de glucosa"></canvas>
    <div class="hint">Mueve el cursor o toca la gota</div>
  </div>
  <div class="side">
    <div class="meter">
      <div class="meter-top"><span>Glucosa en ayunas</span><span>ADA</span></div>
      <div class="screen">
        <span class="value" id="val">90</span><span class="unit">mg/dL</span>
        <div class="status"><span class="dot" id="dot"></span><span id="lbl">Normal</span></div>
      </div>
    </div>
    <div class="levels" role="group" aria-label="Nivel de glucosa">
      <button data-k="normal" class="on">Normal</button>
      <button data-k="pre">Prediabetes</button>
      <button data-k="dm">Diabetes</button>
    </div>
    <p class="caption" id="cap"></p>
  </div>
</div>
<script>
(function () {
  var LEVELS = {
    normal: { mg: 90,  n: 16, color: "#2a6fdb", label: "Normal",
              cap: "<b>Menos de 100 mg/dL.</b> La insulina permite que la glucosa entre a las células y el nivel en sangre se mantiene estable." },
    pre:    { mg: 112, n: 30, color: "#f5a524", label: "Prediabetes",
              cap: "<b>Entre 100 y 125 mg/dL.</b> Las células empiezan a resistir la insulina. No suele dar síntomas, pero es reversible." },
    dm:     { mg: 168, n: 56, color: "#e0313f", label: "Diabetes",
              cap: "<b>126 mg/dL o más.</b> La glucosa se acumula en la sangre y con los años daña vasos, riñones, ojos y nervios." }
  };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 0, top = 0;
  var parts = [], ripples = [], mouse = { x: -999, y: -999 };
  var level = LEVELS.normal, shown = level.mg, t0 = performance.now();

  function resize() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W * 0.36, H * 0.33);
    cx = W / 2; cy = H * 0.6; top = cy - R * 1.55;
  }

  function inside(x, y, pad) {
    var r = R - pad;
    var dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy < r * r) return true;
    if (y < cy && y > top + R * 0.45) {
      var k = (y - top) / (cy - top);          // 0 en la punta, 1 en el centro
      return Math.abs(dx) < k * (R - pad) * 0.92;
    }
    return false;
  }

  function spawn() {
    for (var i = 0; i < 60; i++) {
      var x = cx + (Math.random() * 2 - 1) * R, y = top + Math.random() * (cy + R - top);
      if (inside(x, y, 14)) return { x: x, y: y, vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .02, s: 6 + Math.random() * 5, a: 0, dying: false };
    }
    return { x: cx, y: cy, vx: 0, vy: 0, rot: 0, vr: .01, s: 8, a: 0, dying: false };
  }

  function dropPath(scale) {
    var r = R * scale, tp = cy - r * 1.55;
    var p = new Path2D();
    p.moveTo(cx, tp);
    p.bezierCurveTo(cx + r * 0.22, tp + r * 0.62, cx + r, cy - r * 0.42, cx + r, cy);
    p.arc(cx, cy, r, 0, Math.PI);
    p.bezierCurveTo(cx - r, cy - r * 0.42, cx - r * 0.22, tp + r * 0.62, cx, tp);
    p.closePath();
    return p;
  }

  function hex(x, y, s, rot) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = rot + i * Math.PI / 3;
      ctx[i ? "lineTo" : "moveTo"](x + s * Math.cos(a), y + s * Math.sin(a));
    }
    ctx.closePath();
  }

  function setLevel(k) {
    level = LEVELS[k];
    document.querySelectorAll(".levels button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === k); });
    document.getElementById("lbl").textContent = level.label;
    document.getElementById("dot").style.background = level.color;
    document.getElementById("cap").innerHTML = level.cap;
    ripples.push({ x: cx, y: cy, r: 10, a: .7 });
  }

  function frame(now) {
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);

    // latido suave de la gota
    var beat = reduce ? 0 : Math.pow(Math.max(0, Math.sin(t * 2.4)), 12);
    var scale = 1 + beat * 0.025;

    // sombra en el piso
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 1.12, R * 0.75, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();

    var path = dropPath(scale);
    var g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R * 1.5);
    g.addColorStop(0, "#ff6b6b"); g.addColorStop(.55, "#d7263d"); g.addColorStop(1, "#8e1023");
    ctx.fillStyle = g; ctx.fill(path);

    // partículas de glucosa (recortadas a la gota)
    ctx.save(); ctx.clip(path);
    var alive = parts.filter(function (p) { return !p.dying; }).length;
    if (alive < level.n && Math.random() < .5) parts.push(spawn());
    if (alive > level.n) { for (var i = 0; i < parts.length; i++) if (!parts[i].dying) { parts[i].dying = true; break; } }

    var speed = reduce ? .25 : 1;
    // separación mínima entre moléculas para que no se amontonen
    for (var a = 0; a < parts.length; a++) for (var b2 = a + 1; b2 < parts.length; b2++) {
      var A = parts[a], B = parts[b2], sx = A.x - B.x, sy = A.y - B.y, dd = sx * sx + sy * sy, md = (A.s + B.s + 4);
      if (dd < md * md && dd > .01) { var k2 = (md - Math.sqrt(dd)) / md * .08; A.vx += sx * k2; A.vy += sy * k2; B.vx -= sx * k2; B.vy -= sy * k2; }
    }
    parts.forEach(function (p) {
      var dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 4900 && d2 > 1) { var f = (4900 - d2) / 4900 * .9; var d = Math.sqrt(d2); p.vx += dx / d * f; p.vy += dy / d * f; }
      p.vx += (Math.random() - .5) * .06; p.vy += (Math.random() - .5) * .06;
      p.vx *= .96; p.vy *= .96;
      var nx = p.x + p.vx * speed, ny = p.y + p.vy * speed;
      if (!inside(nx, ny, p.s + 4)) { p.vx = (cx - p.x) * .01; p.vy = (cy - p.y) * .01; nx = p.x + p.vx; ny = p.y + p.vy; }
      p.x = nx; p.y = ny; p.rot += p.vr * speed;
      p.a += p.dying ? -.03 : .03; p.a = Math.min(1, p.a);
      hex(p.x, p.y, p.s, p.rot);
      ctx.fillStyle = "rgba(255,255,255," + (.22 * p.a) + ")"; ctx.fill();
      ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(255,255,255," + (.85 * p.a) + ")"; ctx.stroke();
    });
    parts = parts.filter(function (p) { return !(p.dying && p.a <= 0); });

    ripples.forEach(function (r) {
      r.r += 3; r.a -= .015;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255," + Math.max(r.a, 0) + ")"; ctx.lineWidth = 2; ctx.stroke();
    });
    ripples = ripples.filter(function (r) { return r.a > 0; });
    ctx.restore();

    // brillo
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(cx - R * .45, cy - R * .35, R * .1, R * .22, -.5, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.stroke(path);

    // lectura del glucómetro con conteo suave
    shown += (level.mg - shown) * .08;
    document.getElementById("val").textContent = Math.round(shown);

    requestAnimationFrame(frame);
  }

  function pos(e) {
    var r = cv.getBoundingClientRect(), s = e.touches ? e.touches[0] : e;
    return { x: s.clientX - r.left, y: s.clientY - r.top };
  }
  cv.addEventListener("pointermove", function (e) { mouse = pos(e); });
  cv.addEventListener("pointerleave", function () { mouse = { x: -999, y: -999 }; });
  cv.addEventListener("pointerdown", function (e) {
    var p = pos(e); mouse = p; ripples.push({ x: p.x, y: p.y, r: 4, a: .8 });
  });
  document.querySelectorAll(".levels button").forEach(function (b) {
    b.addEventListener("click", function () { setLevel(b.dataset.k); });
  });
  window.addEventListener("resize", function () { resize(); parts = []; });

  resize(); setLevel("normal"); ripples = [];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
